<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile — HealthMind AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/profile.css">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563EB">
</head>
<body>
  <div id="loading-overlay" class="loading-overlay" style="display: flex;">
    <div class="flex flex-col items-center justify-center min-h-screen gap-4">
      <div class="spinner spinner-lg"></div>
      <p class="text-secondary">Loading profile...</p>
    </div>
  </div>

  <div class="app-container">
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation"></aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <main id="main-content" class="main-content">
      <header class="page-header">
        <div class="flex items-center gap-3">
          <button class="mobile-menu-toggle" aria-label="Toggle menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/>
            </svg>
          </button>
          <h1 class="page-header-title">👤 Profile</h1>
        </div>
        <div class="page-header-actions">
          <button class="theme-toggle" aria-label="Toggle theme">
            <span class="icon-sun">☀️</span>
            <span class="icon-moon">🌙</span>
          </button>
        </div>
      </header>

      <div id="page-content" class="page-content">
        <div class="profile-grid">
          <!-- Profile Card -->
          <div class="card profile-card">
            <div class="profile-avatar">
              <span id="profile-initials">U</span>
            </div>
            <h2 id="profile-name">User Name</h2>
            <p id="profile-email" style="color: var(--color-text-secondary);">user@example.com</p>
            <span class="badge" id="profile-role">Patient</span>
          </div>

          <!-- Personal Information -->
          <div class="card">
            <h3>Personal Information</h3>
            <form id="profile-form" novalidate>
              <div class="input-group">
                <label class="input-label">Full Name <span class="required">*</span></label>
                <input type="text" id="profile-fullname" class="input-field" required>
              </div>
              <div class="input-group">
                <label class="input-label">Email <span class="required">*</span></label>
                <input type="email" id="profile-email-input" class="input-field" required>
              </div>
              <div class="input-group">
                <label class="input-label">Phone</label>
                <input type="tel" id="profile-phone" class="input-field">
              </div>
              <div class="input-group">
                <label class="input-label">Date of Birth</label>
                <input type="date" id="profile-dob" class="input-field">
              </div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>

          <!-- Change Password -->
          <div class="card">
            <h3>Change Password</h3>
            <form id="password-form" novalidate>
              <div class="input-group">
                <label class="input-label">Current Password <span class="required">*</span></label>
                <input type="password" id="current-password" class="input-field" required>
              </div>
              <div class="input-group">
                <label class="input-label">New Password <span class="required">*</span></label>
                <input type="password" id="new-password" class="input-field" required minlength="8">
              </div>
              <div class="input-group">
                <label class="input-label">Confirm New Password <span class="required">*</span></label>
                <input type="password" id="confirm-password" class="input-field" required>
              </div>
              <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
          </div>

          <!-- Danger Zone -->
          <div class="card" style="border-color: var(--color-danger);">
            <h3 style="color: var(--color-danger);">⚠️ Danger Zone</h3>
            <p style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">
              Once you delete your account, there is no going back. Please be certain.
            </p>
            <button class="btn btn-danger" id="delete-account-btn">Delete Account</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <nav id="bottom-nav" class="bottom-nav" role="navigation" aria-label="Mobile navigation"></nav>
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
