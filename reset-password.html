<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — HealthMind AI</title>
  <meta name="description" content="Choose a new password for your HealthMind AI account">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/themes.css">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563EB">
</head>
<body>
  <div id="loading-overlay" style="display: none;"></div>

  <div class="app-container" style="min-height: 100vh; align-items: center; justify-content: center; background: var(--color-background);">
    <div style="width: 100%; max-width: 440px; padding: var(--spacing-6);">
      <div style="text-align: center; margin-bottom: var(--spacing-8);">
        <a href="/" class="sidebar-brand" style="justify-content: center;">
          <span class="sidebar-brand-icon">HM</span>
          <span class="sidebar-brand-text" style="font-size: var(--font-size-xl);">HealthMind AI</span>
        </a>
        <h2 style="font-size: var(--font-size-2xl); margin-top: var(--spacing-6); margin-bottom: var(--spacing-2);">Set a New Password</h2>
        <p style="color: var(--color-text-secondary);">Enter your new password below</p>
      </div>

      <div class="card" id="reset-password-card" style="padding: var(--spacing-8);">
        <form id="reset-password-form" novalidate>
          <div class="input-group">
            <label for="password" class="input-label">
              New Password <span class="required">*</span>
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                class="input-field"
                placeholder="Create a new password"
                required
                autocomplete="new-password"
                minlength="8"
              >
              <button type="button" class="input-toggle" aria-label="Toggle password visibility" id="password-toggle">
                👁️
              </button>
            </div>
            <div class="input-error" id="password-error"></div>
          </div>

          <div class="input-group">
            <label for="confirm-password" class="input-label">
              Confirm New Password <span class="required">*</span>
            </label>
            <input
              type="password"
              id="confirm-password"
              class="input-field"
              placeholder="Confirm your new password"
              required
              autocomplete="new-password"
            >
            <div class="input-error" id="confirm-password-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-password-btn">
            Reset Password
          </button>

          <p style="text-align: center; margin-top: var(--spacing-4); font-size: var(--font-size-sm);">
            <a href="/login.html">← Back to Log In</a>
          </p>
        </form>

        <div id="success-state" style="display: none; text-align: center;">
          <div style="font-size: 48px; margin-bottom: var(--spacing-4);">✅</div>
          <h3 style="margin-bottom: var(--spacing-2);">Password Updated</h3>
          <p style="color: var(--color-text-secondary);">
            Your password has been reset successfully. You can now log in with your new password.
          </p>
          <a href="/login.html" class="btn btn-primary" style="margin-top: var(--spacing-4);">Go to Log In</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
