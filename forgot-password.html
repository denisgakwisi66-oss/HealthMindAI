<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — HealthMind AI</title>
  <meta name="description" content="Reset your HealthMind AI password">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/themes.css">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563EB">
</head>
<body>
  <div id="loading-overlay" style="display: none;"></div>

  <div class="app-container" style="min-height: 100vh; align-items: center; justify-content: center; background: var(--color-background);">
    <div style="width: 100%; max-width: 440px; padding: var(--spacing-6);">
      <!-- Brand -->
      <div style="text-align: center; margin-bottom: var(--spacing-8);">
        <a href="/" class="sidebar-brand" style="justify-content: center;">
          <span class="sidebar-brand-icon">HM</span>
          <span class="sidebar-brand-text" style="font-size: var(--font-size-xl);">HealthMind AI</span>
        </a>
        <h2 style="font-size: var(--font-size-2xl); margin-top: var(--spacing-6); margin-bottom: var(--spacing-2);">Reset Password</h2>
        <p style="color: var(--color-text-secondary);">We'll send you a link to reset your password</p>
      </div>

      <!-- Form -->
      <div class="card" style="padding: var(--spacing-8);">
        <form id="forgot-form" novalidate>
          <div class="input-group">
            <label for="email" class="input-label">
              Email Address <span class="required">*</span>
            </label>
            <input 
              type="email" 
              id="email" 
              class="input-field" 
              placeholder="you@example.com"
              required
              autocomplete="email"
              autofocus
            >
            <div class="input-error" id="email-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-btn">
            Send Reset Link
          </button>

          <p style="text-align: center; margin-top: var(--spacing-4); font-size: var(--font-size-sm);">
            <a href="/login.html">← Back to Log In</a>
          </p>
        </form>

        <!-- Success State (hidden initially) -->
        <div id="success-state" style="display: none; text-align: center;">
          <div style="font-size: 48px; margin-bottom: var(--spacing-4);">📧</div>
          <h3 style="margin-bottom: var(--spacing-2);">Check Your Email</h3>
          <p style="color: var(--color-text-secondary);">
            We've sent a password reset link to <strong id="sent-email"></strong>
          </p>
          <button type="button" class="btn btn-outline" onclick="location.href='/login.html'" style="margin-top: var(--spacing-4);">
            Return to Log In
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import AuthService from '/js/services/auth.js';
    import App from '/js/app.js';

    const form = document.getElementById('forgot-form');
    const emailInput = document.getElementById('email');
    const resetBtn = document.getElementById('reset-btn');
    const successState = document.getElementById('success-state');
    const sentEmail = document.getElementById('sent-email');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Clear errors
      const errorEl = document.getElementById('email-error');
      errorEl.textContent = '';
      emailInput.classList.remove('error');

      // Validate
      const email = emailInput.value.trim();
      if (!email) {
        errorEl.textContent = 'Email is required';
        emailInput.classList.add('error');
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errorEl.textContent = 'Please enter a valid email address';
        emailInput.classList.add('error');
        return;
      }

      // Show loading
      resetBtn.disabled = true;
      resetBtn.innerHTML = '<div class="spinner spinner-sm spinner-white"></div> Sending...';

      try {
        await AuthService.forgotPassword(email);
        
        // Show success
        form.style.display = 'none';
        successState.style.display = 'block';
        sentEmail.textContent = email;
        
        App.showToast('success', 'Reset Link Sent', 'Check your email for the password reset link.');

      } catch (error) {
        App.handleError(error);
        resetBtn.disabled = false;
        resetBtn.textContent = 'Send Reset Link';
        
        if (error.status === 404) {
          // Don't reveal if email exists or not for security
          // Still show success to prevent email enumeration
          form.style.display = 'none';
          successState.style.display = 'block';
          sentEmail.textContent = email;
        }
      }
    });

    App.hideLoading();
  </script>
</body>
</html>
